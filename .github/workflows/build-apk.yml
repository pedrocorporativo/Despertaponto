name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Create Android wrapper
        run: flutter create --platforms=android --project-name despertador_pro .

      - name: Restore custom Android sources
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml || true
          git checkout -- android/app/src/main/kotlin/com/pedro/despertadorpro || true
          git checkout -- android/app/src/main/res/values/styles.xml || true
          git checkout -- android/app/build.gradle android/build.gradle android/settings.gradle || true

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Despertador-Pro
          path: build/app/outputs/flutter-apk/app-release.apk
